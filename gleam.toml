name = "gaseto"
version = "0.0.1"
target = "erlang"
gleam = ">= 1.12.0"

description = "PASETO (Platform-Agnostic SEcurity TOkens) V3 and V4 for Gleam"
licences = ["MIT"]
repository = { type = "github", user = "atomfinger", repo = "gaseto" }

[documentation]
pages = [
  { title = "Using Gaseto with HTTP", path = "http.html", source = "./doc/http.md" },
  { title = "Keys", path = "keys.html", source = "./doc/keys.md" },
]

[dependencies]
gleam_stdlib = ">= 0.44.0 and < 2.0.0"
gleam_crypto = ">= 1.5.1 and < 2.0.0"
kryptos = ">= 1.5.0 and < 2.0.0"
eblake2 = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
